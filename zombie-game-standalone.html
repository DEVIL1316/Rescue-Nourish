<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zombie Survival Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      background: #000;
    }
    
    #root {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    
    .hud {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font-size: 18px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      z-index: 10;
      background: rgba(0,0,0,0.5);
      padding: 15px;
      border-radius: 8px;
    }
    
    .menu {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.9);
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      color: white;
      z-index: 100;
    }
    
    .menu h1 {
      font-size: 48px;
      margin-bottom: 30px;
      color: #ff0000;
      text-shadow: 0 0 20px rgba(255,0,0,0.5);
    }
    
    .menu button {
      background: #ff0000;
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 20px;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px;
      transition: all 0.3s;
    }
    
    .menu button:hover {
      background: #cc0000;
      transform: scale(1.05);
    }
    
    .crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 30px;
      height: 30px;
      pointer-events: none;
      z-index: 5;
    }
    
    .crosshair::before,
    .crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.8);
    }
    
    .crosshair::before {
      width: 2px;
      height: 100%;
      left: 50%;
      transform: translateX(-50%);
    }
    
    .crosshair::after {
      width: 100%;
      height: 2px;
      top: 50%;
      transform: translateY(-50%);
    }
    
    .minimap {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 200px;
      height: 200px;
      background: rgba(0,0,0,0.7);
      border: 2px solid white;
      border-radius: 8px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/three@0.170.0/build/three.min.js"></script>
  <script src="https://unpkg.com/@react-three/fiber@8.18.0/dist/index.cjs.js"></script>
  
  <script type="text/babel" data-type="module">
    const { useState, useEffect, useRef, useMemo } = React;
    
    // Game State Management
    const gameState = {
      status: 'menu',
      playerHealth: 100,
      playerPosition: { x: 0, y: 0, z: 0 },
      currentWeapon: 0,
      weapons: [
        { name: 'Pistol', damage: 25, ammo: 50, maxAmmo: 50, fireRate: 500, range: 30 },
        { name: 'Rifle', damage: 50, ammo: 30, maxAmmo: 30, fireRate: 800, range: 50 },
        { name: 'Shotgun', damage: 75, ammo: 20, maxAmmo: 20, fireRate: 1200, range: 15 }
      ],
      zombies: [],
      wave: 1,
      kills: 0,
      score: 0,
      safeZoneRadius: 50,
      lastShot: 0,
      listeners: new Set()
    };
    
    const subscribe = (listener) => {
      gameState.listeners.add(listener);
      return () => gameState.listeners.delete(listener);
    };
    
    const notify = () => {
      gameState.listeners.forEach(listener => listener());
    };
    
    const updateState = (updates) => {
      Object.assign(gameState, updates);
      notify();
    };
    
    // Game Actions
    const startGame = () => {
      updateState({
        status: 'playing',
        playerHealth: 100,
        kills: 0,
        score: 0,
        wave: 1,
        zombies: [],
        safeZoneRadius: 50
      });
      spawnInitialWave();
    };
    
    const spawnInitialWave = () => {
      const zombies = [];
      const count = 5 + gameState.wave * 2;
      
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count;
        const distance = 30 + Math.random() * 20;
        
        zombies.push({
          id: Math.random().toString(36).substr(2, 9),
          position: [
            Math.cos(angle) * distance,
            0.5,
            Math.sin(angle) * distance
          ],
          health: 100,
          type: ['normal', 'runner', 'tank'][Math.floor(Math.random() * 3)],
          speed: 0.02,
          damage: 10
        });
      }
      
      updateState({ zombies });
    };
    
    const shootWeapon = () => {
      const now = Date.now();
      const weapon = gameState.weapons[gameState.currentWeapon];
      
      if (now - gameState.lastShot < weapon.fireRate) return;
      if (weapon.ammo <= 0) return;
      
      weapon.ammo--;
      updateState({ lastShot: now });
      
      // Simple hit detection - damage closest zombie in range
      let closestZombie = null;
      let closestDistance = weapon.range;
      
      gameState.zombies.forEach(zombie => {
        const dx = zombie.position[0] - gameState.playerPosition.x;
        const dz = zombie.position[2] - gameState.playerPosition.z;
        const distance = Math.sqrt(dx * dx + dz * dz);
        
        if (distance < closestDistance) {
          closestDistance = distance;
          closestZombie = zombie;
        }
      });
      
      if (closestZombie) {
        closestZombie.health -= weapon.damage;
        if (closestZombie.health <= 0) {
          updateState({
            zombies: gameState.zombies.filter(z => z.id !== closestZombie.id),
            kills: gameState.kills + 1,
            score: gameState.score + 100
          });
        }
      }
      
      notify();
    };
    
    const reloadWeapon = () => {
      const weapon = gameState.weapons[gameState.currentWeapon];
      weapon.ammo = weapon.maxAmmo;
      notify();
    };
    
    // HUD Component
    function HUD() {
      const [, forceUpdate] = useState({});
      
      useEffect(() => {
        return subscribe(() => forceUpdate({}));
      }, []);
      
      if (gameState.status !== 'playing') return null;
      
      const weapon = gameState.weapons[gameState.currentWeapon];
      
      return (
        <div className="hud">
          <div>Health: {gameState.playerHealth}</div>
          <div>Wave: {gameState.wave}</div>
          <div>Kills: {gameState.kills}</div>
          <div>Score: {gameState.score}</div>
          <div>Weapon: {weapon.name}</div>
          <div>Ammo: {weapon.ammo}/{weapon.maxAmmo}</div>
          <div>Zombies: {gameState.zombies.length}</div>
        </div>
      );
    }
    
    // Main Menu Component
    function MainMenu() {
      if (gameState.status !== 'menu') return null;
      
      return (
        <div className="menu">
          <h1>ZOMBIE SURVIVAL</h1>
          <button onClick={startGame}>Start Game</button>
          <div style={{ marginTop: '30px', fontSize: '14px', opacity: 0.7 }}>
            <p>WASD - Move</p>
            <p>Mouse - Look Around</p>
            <p>Click - Shoot</p>
            <p>R - Reload</p>
          </div>
        </div>
      );
    }
    
    // Game Over Component
    function GameOver() {
      const [, forceUpdate] = useState({});
      
      useEffect(() => {
        return subscribe(() => forceUpdate({}));
      }, []);
      
      if (gameState.status !== 'gameover') return null;
      
      return (
        <div className="menu">
          <h1>GAME OVER</h1>
          <div style={{ fontSize: '24px', margin: '20px 0' }}>
            <p>Wave: {gameState.wave}</p>
            <p>Kills: {gameState.kills}</p>
            <p>Score: {gameState.score}</p>
          </div>
          <button onClick={startGame}>Play Again</button>
        </div>
      );
    }
    
    // Crosshair Component
    function Crosshair() {
      if (gameState.status !== 'playing') return null;
      return <div className="crosshair" />;
    }
    
    // Simple Three.js Scene
    function GameScene() {
      const canvasRef = useRef();
      const sceneRef = useRef();
      const cameraRef = useRef();
      const rendererRef = useRef();
      const playerRef = useRef({ x: 0, y: 1.6, z: 0, rotationY: 0 });
      const keysRef = useRef({ w: false, a: false, s: false, d: false });
      const mouseRef = useRef({ x: 0, y: 0 });
      
      useEffect(() => {
        if (gameState.status !== 'playing') return;
        
        // Setup Three.js
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        sceneRef.current = scene;
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0);
        cameraRef.current = camera;
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        canvasRef.current.appendChild(renderer.domElement);
        rendererRef.current = renderer;
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0x666666);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffcc, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);
        
        // Ground
        const groundGeometry = new THREE.PlaneGeometry(800, 800);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x3a5f2a });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
        
        // Player Controls
        const handleKeyDown = (e) => {
          if (e.key.toLowerCase() in keysRef.current) {
            keysRef.current[e.key.toLowerCase()] = true;
          }
          if (e.key.toLowerCase() === 'r') {
            reloadWeapon();
          }
        };
        
        const handleKeyUp = (e) => {
          if (e.key.toLowerCase() in keysRef.current) {
            keysRef.current[e.key.toLowerCase()] = false;
          }
        };
        
        const handleMouseMove = (e) => {
          if (document.pointerLockElement) {
            mouseRef.current.x += e.movementX * 0.002;
            mouseRef.current.y -= e.movementY * 0.002;
            mouseRef.current.y = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, mouseRef.current.y));
          }
        };
        
        const handleClick = () => {
          if (gameState.status === 'playing') {
            document.body.requestPointerLock();
            shootWeapon();
          }
        };
        
        document.addEventListener('keydown', handleKeyDown);
        document.addEventListener('keyup', handleKeyUp);
        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('click', handleClick);
        
        // Animation Loop
        const animate = () => {
          if (gameState.status !== 'playing') return;
          
          // Update player position
          const speed = 0.1;
          const player = playerRef.current;
          
          if (keysRef.current.w) {
            player.x -= Math.sin(mouseRef.current.x) * speed;
            player.z -= Math.cos(mouseRef.current.x) * speed;
          }
          if (keysRef.current.s) {
            player.x += Math.sin(mouseRef.current.x) * speed;
            player.z += Math.cos(mouseRef.current.x) * speed;
          }
          if (keysRef.current.a) {
            player.x -= Math.cos(mouseRef.current.x) * speed;
            player.z += Math.sin(mouseRef.current.x) * speed;
          }
          if (keysRef.current.d) {
            player.x += Math.cos(mouseRef.current.x) * speed;
            player.z -= Math.sin(mouseRef.current.x) * speed;
          }
          
          camera.position.set(player.x, player.y, player.z);
          camera.rotation.set(mouseRef.current.y, mouseRef.current.x, 0);
          
          updateState({ playerPosition: { x: player.x, y: player.y, z: player.z } });
          
          // Update zombies
          gameState.zombies.forEach(zombie => {
            const dx = player.x - zombie.position[0];
            const dz = player.z - zombie.position[2];
            const distance = Math.sqrt(dx * dx + dz * dz);
            
            if (distance > 0.1) {
              zombie.position[0] += (dx / distance) * zombie.speed;
              zombie.position[2] += (dz / distance) * zombie.speed;
            }
            
            // Damage player if too close
            if (distance < 2) {
              gameState.playerHealth -= 0.1;
              if (gameState.playerHealth <= 0) {
                updateState({ status: 'gameover' });
              }
            }
          });
          
          // Clear and redraw zombies
          scene.children = scene.children.filter(child => !child.userData.isZombie);
          
          gameState.zombies.forEach(zombie => {
            const geometry = new THREE.BoxGeometry(1, 2, 1);
            const material = new THREE.MeshStandardMaterial({ 
              color: zombie.type === 'tank' ? 0x8B0000 : zombie.type === 'runner' ? 0xFF4500 : 0x228B22 
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(zombie.position[0], zombie.position[1], zombie.position[2]);
            mesh.castShadow = true;
            mesh.userData.isZombie = true;
            scene.add(mesh);
          });
          
          // Check wave completion
          if (gameState.zombies.length === 0 && gameState.status === 'playing') {
            updateState({ wave: gameState.wave + 1 });
            setTimeout(spawnInitialWave, 2000);
          }
          
          renderer.render(scene, camera);
          requestAnimationFrame(animate);
        };
        
        animate();
        
        // Cleanup
        return () => {
          document.removeEventListener('keydown', handleKeyDown);
          document.removeEventListener('keyup', handleKeyUp);
          document.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('click', handleClick);
          if (canvasRef.current) {
            canvasRef.current.innerHTML = '';
          }
        };
      }, [gameState.status]);
      
      if (gameState.status !== 'playing') return null;
      
      return <div ref={canvasRef} style={{ width: '100%', height: '100%' }} />;
    }
    
    // Main App Component
    function App() {
      const [, forceUpdate] = useState({});
      
      useEffect(() => {
        return subscribe(() => forceUpdate({}));
      }, []);
      
      return (
        <>
          <GameScene />
          <HUD />
          <MainMenu />
          <GameOver />
          <Crosshair />
        </>
      );
    }
    
    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</body>
</html>
